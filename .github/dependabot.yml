version: 2
updates:
  # npm — Discord toolkit + interactions Worker (each has its own lockfile)
  - package-ecosystem: "npm"
    directories:
      - "/discord"
      - "/discord/worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
